# Builds the desktop installer: installer.exe for Windows and a .deb for Linux.
# Push a tag like installer-v1.0.0 to attach both to a GitHub release, or run it
# by hand to download them from the workflow run.
name: Installer

on:
  push:
    tags: ["installer-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - run: cargo build --release --locked
        env:
          # Static C runtime: no Visual C++ Redistributable needed on the user's PC.
          RUSTFLAGS: -C target-feature=+crt-static
      - run: Copy-Item target/release/todo.exe installer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: installer/installer.exe

  linux:
    # The oldest supported runner, so the .deb runs on older glibc too.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - run: cargo install cargo-deb --locked
      - run: cargo deb --locked --output installer.deb
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: installer/installer.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installer.exe
            installer.deb
