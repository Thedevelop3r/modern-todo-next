# Yarn 4, pinned: this release file is committed, so every checkout, CI run and
# Docker build uses the same Yarn - including a global Yarn 1 or the one in the
# node image, which hand off to it.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# A plain node_modules tree. Plug'n'Play breaks Next.js and native modules.
nodeLinker: node-modules

# No dependency runs install scripts. This is Yarn's default already; it is
# spelled out because it replaces npm's `allowScripts`. bcrypt and sharp load
# their bundled prebuilt binaries without one, and mongodb-memory-server fetches
# its mongod on the first test run instead of at install.
enableScripts: false
