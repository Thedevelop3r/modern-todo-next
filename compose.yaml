services:
  mongodb:
    container_name: mongodb
    image: mongo:5.0.2
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    ports:
      - "${MONGODB_LOCAL_PORT}:${MONGODB_DOCKER_PORT}"

    volumes:
      - db:/data/db

  app:
    container_name: modern-todo

    build: .

    restart: unless-stopped

    depends_on:
      - mongodb

    env_file:
      - .env

    # One port for the whole application: pages and /api alike.
    ports:
      - "${PORT}:${PORT}"

    environment:
      MONGO_URL: ${MONGO_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      HOSTNAME: 0.0.0.0
      # The renderer runs as a child of server.js inside this container and
      # listens on loopback only, so it needs no port of its own here.
      PDF_SERVICE_KEY: ${PDF_SERVICE_KEY}
      PDF_SERVICE_SPAWN: ${PDF_SERVICE_SPAWN:-1}

    stdin_open: true
    tty: true

    develop:
      watch:
        - path: .
          action: sync
          target: /app
          ignore:
            - node_modules/
            - .next/

        - path: package.json
          action: rebuild

volumes:
  db:
