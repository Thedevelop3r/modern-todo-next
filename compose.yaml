services:
  mongodb:
    container_name: mongodb
    # 8.0 is the current LTS line. 5.0 went end-of-life in October 2024.
    image: mongo:8.0
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      # Required on Linux kernel 6.19 and newer (SERVER-121912). The image
      # otherwise leaves rseq management to tcmalloc, whose implementation
      # violates the rseq ABI - kernel 6.19 refactored rseq and broke that path,
      # so mongod refuses to start rather than crash later. Setting this to 1
      # hands rseq to glibc, which is the compliant path; MongoDB's own guard
      # accepts it. Harmless on older kernels, so it is set unconditionally.
      GLIBC_TUNABLES: glibc.pthread.rseq=1

    # No host port. Only the app talks to mongo, over this compose network -
    # publishing 27017 exposed the database to anything that can reach the host.
    # For a shell: docker compose exec mongodb mongosh
    volumes:
      - mongo_data:/data/db

    networks:
      - backend

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    container_name: modern-todo

    # The production image: a prebuilt bundle, no dev server and no source sync.
    # Code changes take a rebuild - docker compose up -d --build app
    build: .
    image: modern-todo-app

    restart: unless-stopped

    # Wait for a database that answers, not merely a container that started.
    #
    # Deliberately no dependency on `pdf`: its image takes far longer to build,
    # and the app must not wait for it. The PDF client answers 503 while the
    # renderer is unreachable and picks it up as soon as it is listening.
    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - frontend
      - backend

    env_file:
      - .env

    # One port for the whole application: pages and /api alike.
    ports:
      - "${PORT}:${PORT}"

    environment:
      MONGO_URL: ${MONGO_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Always production in the container, whatever .env says for host runs:
      # server.js starts the Next dev server otherwise, ignoring the built
      # bundle, and the session cookie loses its Secure flag. The image's
      # `ENV NODE_ENV=production` alone is not enough - this would override it.
      NODE_ENV: production
      PORT: ${PORT}
      HOSTNAME: 0.0.0.0
      # The renderer is the `pdf` service below, not a child process - this
      # image does not contain the binary.
      PDF_SERVICE_KEY: ${PDF_SERVICE_KEY}
      PDF_SERVICE_SPAWN: "0"
      PDF_SERVICE_URL: http://pdf:8787
      # How many reverse proxies sit in front of this container. 0 means the app
      # is reached directly, so X-Forwarded-For is not trusted at all.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # Storage plans are self-serve only where this is "true"; off until billing.
      ALLOW_SELF_SERVE_TIERS: ${ALLOW_SELF_SERVE_TIERS:-false}

  pdf:
    container_name: modern-todo-pdf

    # Its own build context: the service shares no code with the application,
    # so the two images build independently and in parallel.
    build: ./services/pdf
    image: modern-todo-pdf

    restart: unless-stopped

    # Internal network only. `expose` is not `ports`: nothing reaches this from
    # the host, and the backend network has no route out either.
    expose:
      - "8787"
    networks:
      - backend

    # Only the shared key - the renderer never sees the database or JWT secrets.
    environment:
      PDF_SERVICE_KEY: ${PDF_SERVICE_KEY}
      PDF_SERVICE_PORT: 8787
      PDF_SERVICE_HOST: 0.0.0.0

    # It writes nothing and reads nothing outside its own binary.
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  # The app's published port lives here.
  frontend:
  # MongoDB and the renderer. `internal` means no outbound route and nothing
  # published to the host - only containers on this network can reach them.
  backend:
    internal: true

volumes:
  # A distinct name from the 5.0-era `db` volume: MongoDB cannot read data files
  # from a different major version in either direction, so the upgrade takes a
  # fresh volume and any older one stays untouched as a rollback.
  mongo_data:
