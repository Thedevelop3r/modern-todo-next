[package]
name = "modern-todo-pdf"
version = "1.0.0"
edition = "2021"
description = "PDF rendering microservice for Modern Todo"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
typst = "0.15.1"
typst-as-lib = "0.16.0"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"

[profile.release]
# The runtime image only needs one small binary, and a PDF service spends its
# time inside typst rather than in our own code.
opt-level = 3
lto = true
codegen-units = 1
strip = true
